# Separate 50k integration and learning pilot; it is not a resumable prefix.
task: nsgym-reacher
environment_id: Reacher-v5
seed: 29
device: cuda:0
steps: 50000
seed_steps: 1000
seed_exploration_transitions: 1001
batch_size: 256
buffer_size: 50000
eval_freq: 10000
eval_episodes: 10
eval_seeds: [10000001, 10000002, 10000003, 10000004, 10000005, 10000006, 10000007, 10000008, 10000009, 10000010]
checkpoint_freq: 10000
updates_per_transition: 1
model_size: 5
compile: false
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
horizon: 3
min_std: 0.05
max_std: 2.0
temperature: 0.5
obs: state
multitask: false
episodic: false
enable_wandb: false
save_video: false
output: results/nsgym/reacher-pilot
nsgym:
  mode: nominal
  mass_scale: 1.0
  max_episode_steps: 50
