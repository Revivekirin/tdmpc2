hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra/launcher=basic
    - hydra.mode=MULTIRUN
    task:
    - task=pick-cube
    - model_size=5
    - episodic=false
    - checkpoint=
    - configs/dynamics_shift@dynamics_shift=action_delay
    - configs/schedule@schedule=fixed
    - dynamics_shift.parameter.shifted=1
    - stage3a.mode=frozen
    - stage3a.seed_set=0,1,2
    - stage3a.fixed_data_collect=true
  job:
    name: adapt_shift
    chdir: null
    override_dirname: checkpoint=,configs/dynamics_shift@dynamics_shift=action_delay,configs/schedule@schedule=fixed,dynamics_shift.parameter.shifted=1,episodic=false,model_size=5,stage3a.fixed_data_collect=true,stage3a.mode=frozen,stage3a.seed_set=0,1,2,task=pick-cube
    id: ???
    num: ???
    config_name: stage3a_matched
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /nfs4/jhkim/repos/tdmpc2
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /nfs4/jhkim/repos/tdmpc2/tdmpc2
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      configs/analysis@analysis: disabled
      configs/evaluation@evaluation: standard
      configs/adaptation@adaptation: frozen
      configs/schedule@schedule: fixed
      configs/dynamics_shift@dynamics_shift: action_delay
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
dynamics_shift:
  enabled: true
  application: step
  parameter:
    type: action_delay
    target: arm
    nominal: 0
    shifted: 1
    reset_queue_on_episode: true
    initial_action:
    - 0
    - 0
    - 0
    - 0
  schedule:
    type: fixed
    clock: global_native_step
    reset_on_episode: false
    switch_step: 100
    interval: 200
    duration: 200
    amplitude: 1.0
    seed: 42
    values: null
    segments: []
  observability:
    expose_shift_parameter_to_agent: false
    expose_executed_action_to_agent: false
  logging:
    save_step_trace: true
    save_shift_events: true
    save_episode_summary: true
